[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titanic"
version = "0.1.0"
description = "Titanic Kaggle con estándares MLOps"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3",
    "mlflow>=3.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ipykernel",
    "jupyterlab",
    "dvc>=3",
    "kaggle>=1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/titanic"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
